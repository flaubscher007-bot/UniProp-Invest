<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kampus — University Property Portfolio</title>
<meta name="description" content="Track, shortlist and manage 2-bedroom investment properties near South African university campuses.">
<meta name="theme-color" content="#14231d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kampus">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Optional: real PDF export when available; app falls back to print-to-PDF if these don't load -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#132420; --ink2:#1c332c; --paper:#e9ede8; --card:#ffffff; --card2:#f5f8f3;
  --emerald:#1d6b4f; --emerald-d:#134c38; --emerald-bg:#e5f0ea;
  --brass:#b58f43; --brass-d:#8f6f2e; --brass-bg:#f6efdd;
  --clay:#a94b3d; --clay-bg:#f7e9e6; --amber:#b07d24; --amber-bg:#fbf3e0;
  --slate:#586460; --mut:#8a938d; --line:#d7ded6; --slate-bg:#eceff0;
  --good:#1d6b4f; --good-bg:#e5f0ea; --warn:#b07d24; --warn-bg:#fbf3e0; --bad:#a94b3d; --bad-bg:#f7e9e6;
  --shadow:0 1px 2px rgba(15,30,25,.05),0 6px 20px rgba(15,30,25,.06);
  --shadow-lg:0 10px 40px rgba(15,30,25,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
h1,h2,h3,h4{margin:0;line-height:1.12}
.serif{font-family:'Fraunces',Georgia,serif}
button{font-family:inherit;cursor:pointer}
a{color:var(--emerald-d)}
input,select,textarea{font-family:inherit;font-size:14px}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.13em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* header */
header{background:linear-gradient(120deg,#0f231e,#1c3a2f 70%);color:#eef2ee;padding:14px 16px;position:relative;z-index:40}
.brandrow{display:flex;align-items:center;gap:11px;max-width:1160px;margin:0 auto}
.mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brass),#d8b869);
  display:grid;place-items:center;font-family:'Fraunces';font-weight:700;color:#20180a;font-size:20px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand h1{font-family:'Fraunces';font-size:22px;letter-spacing:.2px;font-weight:600}
.brand p{margin:1px 0 0;font-size:11.5px;color:#a9bcb1;letter-spacing:.3px}
.hstats{margin-left:auto;display:flex;gap:20px;text-align:right}
.hstat b{display:block;font-family:'Fraunces';font-size:18px;font-weight:600}
.hstat span{font-size:10.5px;color:#a9bcb1}
@media(max-width:640px){.hstats{gap:14px}.hstat.opt{display:none}.brand h1{font-size:19px}}

/* tabs */
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.tabs{display:flex;gap:1px;overflow-x:auto;max-width:1160px;margin:0 auto;padding:0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;padding:13px 12px 11px;font-size:13.5px;font-weight:600;color:var(--slate);
  white-space:nowrap;border-bottom:2.5px solid transparent;display:flex;gap:6px;align-items:center}
.tab .ico{width:15px;height:15px}
.tab .cnt{background:var(--slate-bg);color:var(--slate);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.tab.active{color:var(--emerald-d);border-color:var(--brass)}
.tab.active .cnt{background:var(--emerald-bg);color:var(--emerald-d)}

main{max-width:1160px;margin:0 auto;padding:16px 14px 70px}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow);min-height:186px;display:flex;align-items:flex-end}
.hero svg.herobg{position:absolute;inset:0;width:100%;height:100%}
.heroinner{position:relative;padding:18px 20px;color:#f3f1e8;z-index:2}
.eyebrow{font-size:12px;letter-spacing:.4px;color:#e6cf97;margin-bottom:4px}
.herotitle{font-family:'Fraunces';font-size:34px;font-weight:600;letter-spacing:.3px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.herometa{font-size:12.5px;color:#d8ddd4;margin-top:6px;display:flex;align-items:center;gap:6px;max-width:640px}
@media(max-width:640px){.herotitle{font-size:27px}.hero{min-height:158px}}

/* notices + toolbars */
.notice{background:var(--brass-bg);border:1px solid #e6d3a3;border-radius:14px;padding:12px 15px;font-size:13px;color:#6b531b;margin-bottom:14px}
.notice b{color:#523f12}
.toolbar{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.toolbar .sub{color:var(--slate);font-size:13px}
.spacer{flex:1}
.sectionhead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.sectionhead h2{font-family:'Fraunces';font-size:24px;font-weight:600;letter-spacing:.2px}
.sectionhead .sub{color:var(--slate);font-size:13px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:7px 13px;font-size:12.5px;color:var(--slate);font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* export dropdown */
details.exp{position:relative}
details.exp summary{list-style:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--card);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink)}
details.exp summary::-webkit-details-marker{display:none}
details.exp[open] summary{border-color:var(--brass);color:var(--brass-d)}
.expmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:170px;z-index:20}
.expmenu button{display:flex;width:100%;align-items:center;gap:9px;border:none;background:none;padding:9px 11px;
  border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink);text-align:left}
.expmenu button:hover{background:var(--card2)}
.expmenu .k{margin-left:auto;font-size:11px;color:var(--mut)}

/* listing cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.lcard.shortlisted{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),var(--shadow)}
.cover{position:relative;aspect-ratio:16/9;background:#12241d;overflow:hidden}
.coversvg,.coverimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.coverprice{position:absolute;left:12px;bottom:12px;background:rgba(15,30,25,.72);backdrop-filter:blur(3px);
  color:#fff;font-family:'Fraunces';font-weight:600;font-size:19px;padding:5px 12px;border-radius:10px;letter-spacing:.3px}
.covertag{position:absolute;right:12px;top:12px;background:var(--brass);color:#241a08;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px}
.covercam{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:9px;border:none;
  background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;font-size:15px}
.lbody{padding:13px 14px 14px;display:flex;flex-direction:column;gap:9px}
.ltitle{font-family:'Fraunces';font-size:16px;font-weight:600;line-height:1.2}
.lsub{font-size:12.5px;color:var(--slate);display:flex;align-items:center;gap:5px}
.lsub .ico{color:var(--brass-d);width:14px;height:14px}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{font-size:11px;font-weight:600;border-radius:7px;padding:3px 8px;white-space:nowrap}
.b-cheap{background:var(--emerald-bg);color:var(--emerald-d)}
.b-sim{background:var(--slate-bg);color:var(--slate)}
.b-exp{background:var(--clay-bg);color:var(--clay)}
.b-over{background:var(--brass-bg);color:var(--brass-d)}
.b-q{background:#eee;color:#777}
.b-garden{background:#e7f0e6;color:#3a6b39}
.b-focus{background:var(--brass);color:#241a08}
.focuspanel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 13px;margin-bottom:12px;box-shadow:var(--shadow)}
.focuspanel summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:600;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:7px}
.focuspanel summary::-webkit-details-marker{display:none}
.focuspanel summary .ico{color:var(--brass-d)}
.focusbody{padding:0 0 14px}
.prefpills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.prefpill{display:inline-flex;align-items:center;gap:7px;background:var(--brass-bg);color:var(--brass-d);border-radius:20px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600}
.prefpill button{border:none;background:rgba(0,0,0,.09);color:var(--brass-d);width:19px;height:19px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center}
.chip.focuschip{border-color:var(--brass)}
.chip.focuschip.on{background:var(--brass);color:#241a08;border-color:var(--brass)}
.score-good{background:var(--emerald-bg);color:var(--emerald-d)}
.score-warn{background:var(--warn-bg);color:var(--warn)}
.score-bad{background:var(--slate-bg);color:var(--slate)}
.sortsel{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--ink)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:560px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.statv{font-family:'Fraunces';font-size:23px;font-weight:700;letter-spacing:-.3px}
.statl{font-size:11.5px;color:var(--slate);margin-top:2px}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.minilist{display:flex;flex-direction:column;gap:8px}
.minirow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
.mini-l{display:flex;flex-direction:column}
.mini-l b{font-family:'Fraunces';font-size:15px}
.mini-l span{font-size:12px;color:var(--slate)}
.specs{display:flex;gap:14px;font-size:12.5px;color:var(--slate);flex-wrap:wrap;align-items:center}
.specs span{display:inline-flex;align-items:center;gap:5px}
.specs .ico{width:15px;height:15px;color:var(--brass-d)}
.specs b{color:var(--ink);font-weight:600}
.cash{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:12px}
.cash .row{display:flex;justify-content:space-between;gap:8px}
.cash .net{font-weight:700;font-family:'Fraunces'}
.pos{color:var(--emerald-d)} .neg{color:var(--clay)}
.arearow{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
  border-radius:20px;padding:6px 10px;font-size:11.5px;font-weight:600;color:var(--slate)}
.pill .ico{width:13px;height:13px}
.pill.p-good{background:var(--good-bg);border-color:transparent;color:var(--good)}
.pill.p-warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.pill.p-bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.anote{font-size:12px;color:var(--ink);background:#fbfaf5;border:1px dashed var(--line);border-radius:9px;padding:7px 9px;white-space:pre-wrap}
.lactions{display:flex;gap:6px;flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;
  color:var(--ink);display:inline-flex;gap:5px;align-items:center;text-decoration:none}
.act .ico{width:14px;height:14px}
.act.p{background:var(--emerald);border-color:var(--emerald);color:#fff}
.act.wa{background:#1f7a34;border-color:#1f7a34;color:#fff}
.act.on{background:var(--brass-bg);border-color:var(--brass);color:var(--brass-d)}
.act.photos{background:var(--ink);border-color:var(--ink);color:#fff}
.agentblock{border-top:1px dashed var(--line);padding-top:10px;margin-top:1px}
.agenthd{font-size:11.5px;font-weight:700;color:var(--slate);display:flex;align-items:center;gap:6px;margin-bottom:7px}
.agenthd .ico{color:var(--brass-d);width:14px;height:14px}
.visit{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.visit button{border:none;background:var(--card);padding:8px 10px;font-size:12px;font-weight:600;color:var(--slate);border-right:1px solid var(--line)}
.visit button:last-child{border-right:none}
.visit button.yes.on{background:var(--emerald);color:#fff}
.visit button.maybe.on{background:var(--amber);color:#fff}
.visit button.no.on{background:var(--clay);color:#fff}

/* panels / forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{font-family:'Fraunces';font-size:17px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.panel h3 .ico{color:var(--brass-d)}
.panel .desc{color:var(--slate);font-size:12.5px;margin-bottom:13px}
label{display:block;font-size:11.5px;font-weight:600;color:var(--slate);margin:0 0 4px}
.field{margin-bottom:11px}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--emerald);outline-offset:-1px;border-color:var(--emerald)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.frow3{grid-template-columns:1fr 1fr}}
.btn{background:var(--emerald);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:600;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.btn.ghost{background:none;color:var(--emerald-d);border:1px solid var(--line)}
.btn.brass{background:var(--brass);color:#241a08}
.btn.mini{padding:7px 12px;font-size:12.5px}
.btn.danger{background:none;color:var(--clay);border:1px solid var(--clay-bg)}

.led{width:100%;border-collapse:collapse;font-size:13px}
.led th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.led td{padding:8px;border-bottom:1px solid var(--line)}
.led tr:last-child td{border-bottom:none}
.led .num{text-align:right;font-variant-numeric:tabular-nums}
.led .del{color:var(--clay);cursor:pointer;font-weight:700;border:none;background:none;font-size:15px;line-height:1}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.big{font-family:'Fraunces';font-size:26px;font-weight:700;letter-spacing:-.3px}
.empty{text-align:center;color:var(--mut);padding:46px 16px;font-size:14px}
.empty .ic{font-size:30px;display:block;margin-bottom:8px;opacity:.5}
.empty .ico{width:34px;height:34px;color:var(--brass);opacity:.6;margin-bottom:8px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:7px;background:var(--slate-bg);color:var(--slate);font-weight:600}
.ownedhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sub-tabs{display:flex;gap:5px;margin:12px 0;flex-wrap:wrap}
.sub-tabs button{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--slate)}
.sub-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.checklist label{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:13px;margin-bottom:8px;cursor:pointer}
.checklist input{width:auto;margin-top:2px}
.cmpwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.cmp{border-collapse:collapse;font-size:12.5px;min-width:100%}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
.cmp thead th{background:var(--card2);position:sticky;top:0}
.cmp td.lab,.cmp thead th.lab{position:sticky;left:0;background:var(--card2);font-weight:600;color:var(--slate);z-index:1;white-space:normal;min-width:120px}
.cmp td.best{background:var(--emerald-bg);color:var(--emerald-d);font-weight:700}
.cmp .colprice{font-family:'Fraunces';font-weight:700;font-size:15px}
.foot{max-width:1160px;margin:22px auto 0;padding:0 14px;color:var(--mut);font-size:11.5px;text-align:center;line-height:1.6}
.sharebtn{margin-left:12px;flex:none;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);color:#eef2ee;border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:8px 14px;font-weight:600;font-size:13px}
.sharebtn svg{width:16px;height:16px}
@media(max-width:560px){.sharebtn span{display:none}.sharebtn{padding:9px;margin-left:8px}}
.modal{position:fixed;inset:0;background:rgba(10,20,16,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom,0));box-shadow:var(--shadow-lg);position:relative;max-height:92vh;overflow:auto}
@media(min-width:560px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheetx{position:absolute;right:14px;top:10px;border:none;background:none;font-size:28px;line-height:1;color:var(--slate)}
.steps{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px}
.step b{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.step b .ico{color:var(--brass-d)}
.step span{color:var(--slate)}
.notecard{display:flex;gap:9px;background:var(--brass-bg);border:1px solid #e6d3a3;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#5a4412;margin-bottom:10px;align-items:flex-start}
.notecard .ico{flex:none;width:18px;height:18px;color:var(--brass-d);margin-top:1px}
.apkbox summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--emerald-d);padding:6px 0}
.installbtn{margin-left:8px;flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--brass);color:#241a08;border:none;border-radius:22px;padding:8px 13px;font-weight:700;font-size:13px}
.installbtn svg{width:15px;height:15px}
.syncbadge{margin-left:10px;align-self:center;color:#8ee0b8;font-size:11px;font-weight:700;white-space:nowrap}
@media(max-width:560px){.installbtn span{display:none}.installbtn{padding:9px;margin-left:6px}}
@media print{nav,header .hstats,.filters,.lactions,.visit,details.exp{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <div class="mark">K</div>
    <div class="brand">
      <h1 class="serif">Kampus</h1>

/* ---------- listing preview images (best-effort, falls back to SVG cover) ---------- */
function previewChain(l){
  const arr=[];
  if(l.image)arr.push(l.image);
  if((state.settings.previews!==false)&&l.url&&/^https?:/i.test(l.url)){
    const e=encodeURIComponent(l.url);
    arr.push('https://api.microlink.io/?url='+e+'&embed=image.url');           // real listing photo (og:image)
    arr.push('https://s.wordpress.com/mshots/v1/'+e+'?w=680&h=390');           // page screenshot fallback
  }
  return arr;
}

  const ch=previewChain(l); if(!ch.length)return '';

/* ---------- persistence: resilient, never throws ---------- */
let persistMode='memory'; const _mem={};
const store={
  async get(k){
    if(typeof window!=='undefined'&&window.storage&&window.storage.get){try{const r=await window.storage.get(k);persistMode='cloud';return (r&&r.value!=null)?r.value:(_mem[k]??null);}catch(e){}}
    try{const v=localStorage.getItem(k);if(persistMode!=='cloud')persistMode='local';return v!=null?v:(_mem[k]??null);}catch(e){}
    return _mem[k]??null;
  },
  async set(k,v){
    _mem[k]=v;let ok=false;
    if(typeof window!=='undefined'&&window.storage&&window.storage.set){try{await window.storage.set(k,v);persistMode='cloud';ok=true;}catch(e){}}
    if(!ok){try{localStorage.setItem(k,v);if(persistMode!=='cloud')persistMode='local';ok=true;}catch(e){}}
    return ok;
  }
};
async function loadDB(){const raw=await store.get(DB_KEY);if(raw){try{return JSON.parse(raw);}catch(e){}}return null;}
async function saveDB(){await store.set(DB_KEY,JSON.stringify(state));}

/* ---------- helpers ---------- */
const fmt=(n)=> n==null||isNaN(n)?'—':'R'+Math.round(n).toLocaleString('en-ZA');
const fmt0=(n)=> 'R'+Math.round(n).toLocaleString('en-ZA');
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dateStr=()=>new Date().toISOString().slice(0,10);
function bondInstalment(p){const s=state.settings;const r=(s.interest/100)/12,n=s.term*12;if(p<=0)return 0;if(r===0)return p/n;return p*r/(1-Math.pow(1+r,-n));}
function estCosts(price,estRent){const s=state.settings;const bond=bondInstalment(price*(1-s.deposit/100));const maint=price*(s.maintPct/100)/12;const mgmt=(estRent||0)*(s.mgmtPct/100);const vac=(estRent||0)*(s.vacancyPct/100);const total=bond+(+s.levy)+(+s.rates)+(+s.insurance)+maint+mgmt+vac;return{bond,levy:+s.levy,rates:+s.rates,insurance:+s.insurance,maint,mgmt,vac,total};}
function budgetVal(){return state.settings.budget||850000;}
function budgetLbl(){const b=budgetVal();return 'R'+Math.round(b/1000)+'k';}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
function prefsFor(cid){return (state.prefSuburbs&&state.prefSuburbs[cid])||[];}
function inPref(l){const p=prefsFor(l.campus);if(!p.length)return true;const s=norm(l.suburb);return p.some(x=>{const n=norm(x);return n&&(s.includes(n)||n.includes(s));});}
function campusMedian(campus){const B=budgetVal();const v=state.listings.filter(l=>l.campus===campus&&l.price&&l.price<=B).map(l=>l.price).sort((a,b)=>a-b);if(!v.length){const a=state.listings.filter(l=>l.campus===campus&&l.price).map(l=>l.price).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null;}return v[Math.floor(v.length/2)];}
function priceBadge(l){if(l.price==null)return{cls:'b-q',txt:'Price?'};if(l.price>budgetVal())return{cls:'b-over',txt:'Over '+budgetLbl()};const m=campusMedian(l.campus);if(!m)return{cls:'b-sim',txt:'—'};if(l.price<m*0.92)return{cls:'b-cheap',txt:'Cheaper for area'};if(l.price>m*1.08)return{cls:'b-exp',txt:'Pricier for area'};return{cls:'b-sim',txt:'Typical for area'};}
const SAFE={high:{t:'Safe area',c:'p-good'},med:{t:'Mixed area',c:'p-warn'},low:{t:'Caution',c:'p-bad'}};
const DEM={high:{t:'High demand',c:'p-good'},med:{t:'Steady demand',c:'p-warn'},low:{t:'Low demand',c:'p-bad'}};

/* ---------- deal score & sorting ---------- */
function netOf(l){if(l.price==null)return -1e9;const c=estCosts(l.price,l.estRent);return (l.estRent||0)-c.total;}
function dealScore(l){
  if(l.price==null)return null;
  let s=0;const m=campusMedian(l.campus)||l.price,r=l.price/m;
  s+= r<=0.85?25:r<=0.95?20:r<=1.05?14:r<=1.15?8:3;      // value vs area (25)
  const net=netOf(l);
  s+= net>=1500?30:net>=500?24:net>=0?18:net>=-500?11:net>=-1500?5:0; // cashflow (30)
  s+= l.price<=budgetVal()?15:0;                          // within budget (15)
  s+= l.garden?8:0;                                       // garden/future-proof (8)
  s+= l.size?(l.size>=70?7:l.size>=55?4:2):3;             // space (7)
  s+= l.safety==='high'?8:l.safety==='med'?4:l.safety==='low'?0:3; // safety (8)
  s+= l.demand==='high'?7:l.demand==='med'?4:l.demand==='low'?0:3; // demand (7)
  return Math.max(0,Math.min(100,Math.round(s)));
}
function dealTier(sc){return sc>=75?'good':sc>=55?'warn':'bad';}
function sortListings(list){const a=list.slice();
  if(sortMode==='score')a.sort((x,y)=>(dealScore(y)??-1)-(dealScore(x)??-1));
  else if(sortMode==='priceAsc')a.sort((x,y)=>(x.price??1e12)-(y.price??1e12));
  else if(sortMode==='netDesc')a.sort((x,y)=>netOf(y)-netOf(x));
  return a; // 'new' keeps insertion order
}
function sortControl(){return `<select class="sortsel" onchange="sortMode=this.value;render()">
  <option value="score"${sortMode==='score'?' selected':''}>Sort: best deal</option>
  <option value="priceAsc"${sortMode==='priceAsc'?' selected':''}>Sort: price ↑</option>
  <option value="netDesc"${sortMode==='netDesc'?' selected':''}>Sort: net cashflow</option>
  <option value="new"${sortMode==='new'?' selected':''}>Sort: as added</option>
</select>`;}
function miniListing(l){const sc=dealScore(l);return `<button class="minirow" onclick="active='${l.campus}';campusFilter='all';render()"><span class="mini-l"><b>${l.price!=null?fmt(l.price):'—'}</b><span>${esc(l.suburb)} · ${CAMPUSES.find(c=>c.id===l.campus).name}</span></span>${sc!=null?`<span class="badge score-${dealTier(sc)}">◆ ${sc}</span>`:''}</button>`;}

function viewShortlist(){

  if(!list.length)return head+`<div class="empty">${ic('star')}Nothing shortlisted yet. Tap Shortlist on any listing.</div>`;
  const bv=v=>sortListings(list.filter(l=>l.visit===v));
  const sec=(t,a)=>a.length?`<div class="sectionhead" style="margin-top:6px"><h3 class="serif" style="font-size:17px">${t} <span class="tag">${a.length}</span></h3></div><div class="grid">${a.map(listingCard).join('')}</div>`:'';
  return head+sec('Visited — Yes',bv('yes'))+sec('Visited — Maybe',bv('maybe'))+sec('Not visited yet',bv(''))+sec('Visited — No',bv('no'));

/* ---------- COMPARE ---------- */
function viewCompare(){
  const list=state.listings.filter(l=>l.status==='shortlist');
  const head=`<div class="sectionhead"><div><h2>Compare shortlist</h2><div class="sub">Best value in each row is highlighted</div></div><div class="spacer"></div>${list.length>=2?exportBar('compare'):''}</div>`;
  if(list.length<2)return head+`<div class="empty">${ic('scale')}Shortlist at least two places to compare them side by side.</div>`;
  const rows=list.map(l=>{const c=l.price?estCosts(l.price,l.estRent):null;return{l,rm2:(l.price&&l.size)?Math.round(l.price/l.size):null,run:c?c.total:null,net:c?(l.estRent-c.total):null};});
  const minI=f=>{let bi=-1,bv=Infinity;rows.forEach((r,i)=>{const v=f(r);if(v!=null&&v<bv){bv=v;bi=i;}});return bi;};
  const maxI=f=>{let bi=-1,bv=-Infinity;rows.forEach((r,i)=>{const v=f(r);if(v!=null&&v>bv){bv=v;bi=i;}});return bi;};
  const bP=minI(r=>r.l.price),bR=minI(r=>r.rm2),bRent=maxI(r=>r.l.estRent),bRun=minI(r=>r.run),bNet=maxI(r=>r.net),bS=maxI(r=>r.l.size);
  const cell=(h,b)=>`<td class="${b?'best':''}">${h}</td>`;
  const row=(lab,fn,bi)=>`<tr><td class="lab">${lab}</td>${rows.map((r,i)=>cell(fn(r),i===bi)).join('')}</tr>`;
  const vt={yes:'✓ Yes',maybe:'~ Maybe',no:'✗ No','':'—'};
  const header=`<tr><th class="lab">Property</th>${rows.map(r=>`<th><div class="colprice">${r.l.price!=null?fmt(r.l.price):'Price?'}</div><div class="lsub" style="white-space:normal;max-width:160px">${esc(r.l.suburb)}</div><div class="lsub" style="color:var(--mut)">${CAMPUSES.find(c=>c.id===r.l.campus).name}${r.l.radius==='ext'?' · ~30 min':''}</div></th>`).join('')}</tr>`;
  return head+`<div class="cmpwrap"><table class="cmp"><thead>${header}</thead><tbody>
    ${row('Price',r=>r.l.price!=null?fmt(r.l.price):'—',bP)}
    ${row('Beds / baths',r=>r.l.beds+' / '+r.l.baths,-1)}
    ${row('Size',r=>r.l.size?r.l.size+' m²':'—',bS)}
    ${row('Price / m²',r=>r.rm2?fmt0(r.rm2):'—',bR)}
    ${row('Garden',r=>r.l.garden?'Yes':'—',-1)}
    ${row('vs area',r=>priceBadge(r.l).txt,-1)}
    ${row('Est. rent / mo',r=>fmt(r.l.estRent),bRent)}
    ${row('Running cost',r=>r.run!=null?fmt(r.run):'—',bRun)}
    ${row('Net / month',r=>r.net!=null?`<b class="${r.net>=0?'pos':'neg'}">${r.net>=0?'+':''}${fmt(r.net)}</b>`:'—',bNet)}
    ${row('Safety',r=>r.l.safety?SAFE[r.l.safety].t:'—',-1)}
    ${row('Demand',r=>r.l.demand?DEM[r.l.demand].t:'—',-1)}
    ${row('Visit',r=>vt[r.l.visit||''],-1)}
    ${row('Link',r=>r.l.url?`<a href="${esc(r.l.url)}" target="_blank" rel="noopener">Open</a>`:'—',-1)}
  </tbody></table></div>
  <div class="hint" style="margin-top:10px">Highlighted = best in that row. “Net / month” uses your Finances assumptions.</div>`;
}

/* ---------- OWNED ---------- */
function ownedMonthly(o){const inc=(o.income||[]).reduce((s,i)=>s+(+i.amount||0),0);const exp=(o.expenses||[]).reduce((s,i)=>s+(+i.amount||0),0);const plan=estCosts(o.purchasePrice||0,o.rent||0);return{inc,exp,planExpense:plan.total,net:((o.rent||0)-plan.total),ledgerNet:inc-exp};}
function viewOwned(){
  const head=`<div class="sectionhead"><div><h2>Owned properties</h2><div class="sub">Maintenance · income · expenses</div></div><div class="spacer"></div>${state.owned.length?exportBar('owned'):''}<button class="btn mini" onclick="addOwned()">${ic('plus')} Add</button></div>`;
  if(!state.owned.length)return head+`<div class="empty">${ic('home')}No purchased properties yet. Add one, or promote a shortlisted place.</div>`;
  return head+state.owned.map(ownedCard).join('');
}
function ownedCard(o){
  const st=ownedTab[o.id]||'overview',m=ownedMonthly(o);
  const tb=(k,l)=>`<button class="${st===k?'on':''}" onclick="ownedTab['${o.id}']='${k}';render()">${l}</button>`;
  let body= st==='overview'?ownedOverview(o,m): st==='maint'?ownedMaint(o): ownedLedger(o,st==='income'?'income':'expenses');
  const open=(o.maintenance||[]).filter(t=>!t.done).length;
  return `<div class="panel">
    <div class="ownedhead"><div><h3 class="serif">${esc(o.name||'Untitled unit')}</h3><div class="desc">${esc(o.suburb||'')}${o.purchasePrice?' · bought '+fmt(o.purchasePrice):''}</div></div>
      <span class="badge ${m.net>=0?'b-cheap':'b-exp'}">${m.net>=0?'Covers costs +':'Shortfall '}${fmt0(Math.abs(m.net))}/mo</span></div>
    <div class="sub-tabs">${tb('overview','Overview')}${tb('maint','Maintenance'+(open?` (${open})`:''))}${tb('income','Income')}${tb('expenses','Expenses')}</div>
    ${body}
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost mini" onclick="editOwned('${o.id}')">Edit details</button><button class="btn danger mini" onclick="delOwned('${o.id}')">Remove</button></div>
  </div>`;
}
function ownedOverview(o,m){const plan=estCosts(o.purchasePrice||0,o.rent||0);return `<div class="frow">
   <div class="cash"><div class="row"><span>Monthly rent (target)</span><b>${fmt(o.rent)}</b></div>
     <div class="row"><span>Est. bond instalment</span><span>${fmt(plan.bond)}</span></div>
     <div class="row"><span>Levy / rates / insurance</span><span>${fmt(plan.levy+plan.rates+plan.insurance)}</span></div>
     <div class="row"><span>Maint + mgmt + vacancy</span><span>${fmt(plan.maint+plan.mgmt+plan.vac)}</span></div>

   <div class="cash"><div class="row"><span>Income logged</span><b class="pos">${fmt(m.inc)}</b></div>
     <div class="row"><span>Expenses logged</span><b class="neg">${fmt(m.exp)}</b></div>

     <div class="hint">Rent is competitive when it covers most running costs — aim planned net ≥ 0.</div></div></div>`;}
function ownedMaint(o){const tasks=o.maintenance||[];
  const rows=tasks.map(t=>`<tr><td><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${o.id}','${t.id}')" style="width:auto"></td>
    <td ${t.done?'style="text-decoration:line-through;color:var(--mut)"':''}>${esc(t.title)}<div class="hint">${t.due?'Due '+t.due:''}${t.cat?' · '+t.cat:''}</div></td>
    <td class="num">${t.cost?fmt(t.cost):'—'}</td><td><button class="del" onclick="delTask('${o.id}','${t.id}')">×</button></td></tr>`).join('');
  return `${tasks.length?`<table class="led"><thead><tr><th></th><th>Task</th><th class="num">Est. cost</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="hint" style="margin-bottom:10px">No maintenance planned yet.</div>`}
   <div class="frow3" style="margin-top:12px"><div class="field" style="grid-column:1/3;margin:0"><label>Task</label><input type="text" id="mt-${o.id}" placeholder="e.g. Service geyser"></div><div class="field" style="margin:0"><label>Est. cost</label><input type="number" id="mc-${o.id}" placeholder="0"></div></div>

   <button class="btn mini" style="margin-top:10px" onclick="addTask('${o.id}')">${ic('plus')} Add task</button>`;}
function ownedLedger(o,kind){const items=o[kind]||[],cats=kind==='income'?INCOME_CATEGORIES:EXPENSE_CATEGORIES,total=items.reduce((s,i)=>s+(+i.amount||0),0);

   <div class="frow3" style="margin-top:12px"><div class="field" style="margin:0"><label>Date</label><input type="date" id="ld-${kind}-${o.id}"></div><div class="field" style="margin:0"><label>${kind==='income'?'Source':'Category'}</label><select id="lc-${kind}-${o.id}">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field" style="margin:0"><label>Amount</label><input type="number" id="la-${kind}-${o.id}" placeholder="0"></div></div>

     <div class="cash" style="margin-top:12px"><div class="row"><span>Max affordable instalment (≈30% − debts)</span><b id="o-maxinst">—</b></div><div class="row"><span>Max loan you'd qualify for</span><span id="o-maxloan">—</span></div><div class="row net pos"><span>Max purchase price (at this deposit)</span><span id="o-maxprice">—</span></div></div>

function calcCompute(){
  const g=id=>document.getElementById(id);if(!g('c-price'))return;
  const price=+g('c-price').value||0,dep=+g('c-dep').value||0,rate=+g('c-int').value||0,term=+g('c-term').value||0,rent=+g('c-rent').value||0,up=+g('c-upfront').value||0;
  const loan=Math.max(0,price*(1-dep/100)),r=(rate/100)/12,n=term*12;
  const inst=(n<=0)?0:(r?loan*r/(1-Math.pow(1+r,-n)):loan/n);
  g('o-loan').textContent=fmt(loan);g('o-inst').textContent=fmt(inst);g('o-int').textContent=fmt(inst*n-loan);g('o-total').textContent=fmt(inst*n);g('o-cash').textContent=fmt(price*(dep/100)+up);g('c-rent-echo').textContent=fmt(rent);
  const s=state.settings,maint=price*(s.maintPct/100)/12,mgmt=rent*(s.mgmtPct/100),vac=rent*(s.vacancyPct/100);
  const running=inst+(+s.levy)+(+s.rates)+(+s.insurance)+maint+mgmt+vac,net=rent-running;
  g('o-run').textContent=fmt(running);const ne=g('o-net');ne.textContent=(net>=0?'+':'')+fmt(net);ne.className='big '+(net>=0?'pos':'neg');
  const gross=+g('c-gross').value||0,debts=+g('c-debts').value||0,maxInst=Math.max(0,0.30*gross-debts);
  const maxLoan=(n<=0)?0:(r?maxInst*(1-Math.pow(1+r,-n))/r:maxInst*n),maxPrice=dep<100?maxLoan/(1-dep/100):maxLoan;
  g('o-maxinst').textContent=fmt(maxInst);g('o-maxloan').textContent=fmt(maxLoan);g('o-maxprice').textContent=fmt(maxPrice);
}

function doExport(scope,fmtType){

  if(scope.startsWith('campus:')){const cid=scope.split(':')[1],c=CAMPUSES.find(x=>x.id===cid);title=c.name+' listings';columns=LISTING_COLS;rows=state.listings.filter(l=>l.campus===cid).map(listingRow);fname='kampus-'+cid;}
  else if(scope==='shortlist'||scope==='compare'){title=scope==='compare'?'Shortlist comparison':'Shortlist';columns=LISTING_COLS;rows=state.listings.filter(l=>l.status==='shortlist').map(listingRow);fname='kampus-shortlist';}
  else if(scope==='owned'){title='Owned properties';columns=OWNED_COLS;rows=state.owned.map(ownedRow);fname='kampus-owned';}
  else if(scope==='tenants'){title='Tenants & leases';columns=TENANT_COLS;rows=state.tenants.map(tenantRow);fname='kampus-tenants';}
  else if(scope==='finances'){title='Income & expense transactions';columns=TXN_COLS;rows=txnRows();fname='kampus-transactions';}
  else if(scope==='calc'){title='Bond calculation';columns=[{key:'metric',label:'Metric'},{key:'value',label:'Value'}];rows=calcRows();fname='kampus-calc';}
  if(!rows||!rows.length){alert('Nothing to export here yet.');return;}

}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},500);}
function toCSV(title,columns,rows,fname){const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};const lines=[columns.map(c=>q(c.label)).join(',')].concat(rows.map(r=>columns.map(c=>q(r[c.key])).join(',')));dl(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),fname+'-'+dateStr()+'.csv');}
function toXLS(title,columns,rows,fname){const th='<tr>'+columns.map(c=>`<th style="background:#14231d;color:#fff;padding:6px;text-align:left">${esc(c.label)}</th>`).join('')+'</tr>';const tb=rows.map(r=>'<tr>'+columns.map(c=>`<td style="border:1px solid #ccc;padding:5px">${esc(r[c.key])}</td>`).join('')+'</tr>').join('');const html='<html><head><meta charset="utf-8"></head><body><h3>Kampus — '+esc(title)+'</h3><table border="1" style="border-collapse:collapse">'+th+tb+'</table></body></html>';dl(new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'}),fname+'-'+dateStr()+'.xls');}
function toPDF(title,columns,rows,fname){
  const J=window.jspdf&&window.jspdf.jsPDF;

    if(!doc.autoTable){printFallback(title,columns,rows);return;}
    doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(19,36,32);doc.text('Kampus — '+title,40,40);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(120);doc.text(new Date().toLocaleString('en-ZA'),40,56);
    doc.autoTable({head:[columns.map(c=>c.label)],body:rows.map(r=>columns.map(c=>{const v=r[c.key];return v==null?'':String(v);})),startY:70,styles:{fontSize:8,cellPadding:4,overflow:'linebreak'},headStyles:{fillColor:[19,36,32],textColor:255},alternateRowStyles:{fillColor:[240,243,240]},margin:{left:40,right:40}});
    doc.save(fname+'-'+dateStr()+'.pdf');

function printFallback(title,columns,rows){
  const style='<style>body{font-family:Inter,Arial,sans-serif;color:#132420;padding:24px}h1{font-family:Georgia,serif;font-size:20px;margin:0 0 2px}small{color:#888}table{border-collapse:collapse;width:100%;font-size:11px;margin-top:12px}th,td{border:1px solid #cbd3cb;padding:6px 8px;text-align:left}th{background:#132420;color:#fff}tr:nth-child(even){background:#f2f5f2}</style>';

  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print();},400);return;}
  const ifr=document.createElement('iframe');ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(ifr);
  const d=ifr.contentWindow.document;d.open();d.write(html);d.close();setTimeout(()=>{ifr.contentWindow.focus();ifr.contentWindow.print();setTimeout(()=>ifr.remove(),1500);},400);

  state.listings.push({id:uid(),campus:g('a-campus').value,suburb:g('a-suburb').value,title:g('a-title').value||'New listing',price,beds:+g('a-beds').value||2,baths:+g('a-baths').value||1,size:g('a-size').value?+g('a-size').value:null,garden:g('a-garden').value==='true',radius:g('a-radius').value,drive:g('a-drive').value,complex:g('a-complex').value,estRent:+g('a-rent').value||0,image:g('a-image').value.trim(),url:g('a-url').value,agentName:g('a-agentName').value.trim(),agency:'',agentPhone:g('a-agentPhone').value.trim(),agentEmail:g('a-agentEmail').value.trim(),source:'Manual',seen:new Date().toLocaleDateString('en-ZA',{month:'short',year:'numeric'}),status:'new',visit:'',whatsapp:false,notes:'',safety:'',demand:'',areaNote:''});
  active=g('a-campus').value;campusFilter='all';persist();}
function addOwned(){state.owned.push({id:uid(),name:'New unit',suburb:'',purchasePrice:0,rent:0,maintenance:[],income:[],expenses:[]});persist();}
function editOwned(id){const o=state.owned.find(x=>x.id===id);o.name=prompt('Property name:',o.name)??o.name;o.suburb=prompt('Suburb:',o.suburb)??o.suburb;const p=prompt('Purchase price (R):',o.purchasePrice);if(p!==null)o.purchasePrice=+p||0;const r=prompt('Target monthly rent (R):',o.rent);if(r!==null)o.rent=+r||0;persist();}
function delOwned(id){if(confirm('Remove this property and its ledgers?')){state.owned=state.owned.filter(x=>x.id!==id);persist();}}
function addTask(oid){const o=state.owned.find(x=>x.id===oid),g=id=>document.getElementById(id),title=g('mt-'+oid).value.trim();if(!title){alert('Enter a task.');return;}o.maintenance=o.maintenance||[];o.maintenance.push({id:uid(),title,cost:+g('mc-'+oid).value||0,due:g('md-'+oid).value,cat:g('mcat-'+oid).value,done:false});persist();}
function toggleTask(oid,tid){const o=state.owned.find(x=>x.id===oid),t=o.maintenance.find(x=>x.id===tid);t.done=!t.done;persist();}
function delTask(oid,tid){const o=state.owned.find(x=>x.id===oid);o.maintenance=o.maintenance.filter(x=>x.id!==tid);persist();}
function addLedger(oid,kind){const o=state.owned.find(x=>x.id===oid),g=id=>document.getElementById(id),amt=+g(`la-${kind}-${oid}`).value;if(!amt){alert('Enter an amount.');return;}o[kind]=o[kind]||[];o[kind].push({id:uid(),date:g(`ld-${kind}-${oid}`).value||dateStr(),cat:g(`lc-${kind}-${oid}`).value,amount:amt,note:g(`ln-${kind}-${oid}`).value});persist();}
function delLedger(oid,kind,lid){const o=state.owned.find(x=>x.id===oid);o[kind]=o[kind].filter(x=>x.id!==lid);persist();}
function saveSettings(){['budget','deposit','interest','term','levy','rates','insurance','maintPct','mgmtPct','vacancyPct'].forEach(k=>{const el=document.getElementById('set-'+k);if(el)state.settings[k]=+el.value||0;});persist();}
function addTenant(){state.tenants.push({id:uid(),name:'New tenant',unit:'',rent:0,escalation:0,deposit:0,depositWhere:'',start:'',end:'',status:'',notes:'',checklist:[]});persist();}
function editTenant(id){const t=state.tenants.find(x=>x.id===id);t.name=prompt('Tenant name:',t.name)??t.name;t.unit=prompt('Unit / property:',t.unit)??t.unit;const r=prompt('Monthly rent (R):',t.rent);if(r!==null)t.rent=+r||0;const e=prompt('Annual escalation %:',t.escalation);if(e!==null)t.escalation=+e||0;const d=prompt('Deposit (R):',t.deposit);if(d!==null)t.deposit=+d||0;t.depositWhere=prompt('Deposit held where:',t.depositWhere)??t.depositWhere;t.start=prompt('Lease start (YYYY-MM-DD):',t.start)??t.start;t.end=prompt('Lease end (YYYY-MM-DD):',t.end)??t.end;t.notes=prompt('Notes:',t.notes)??t.notes;persist();}
function cycleStatus(id){const t=state.tenants.find(x=>x.id===id),o=['Paid','Arrears','Vacant','Notice given'];t.status=o[(o.indexOf(t.status)+1)%o.length];persist();}
function toggleTenantChk(id,i){const t=state.tenants.find(x=>x.id===id);t.checklist=t.checklist||[];t.checklist[i]=!t.checklist[i];persist();}
function delTenant(id){if(confirm('Remove this tenant?')){state.tenants=state.tenants.filter(x=>x.id!==id);persist();}}
function exportJSON(){dl(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'kampus-portfolio-'+dateStr()+'.json');}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);state=Object.assign({listings:[],owned:[],tenants:[],settings:defaultSettings(),prefSuburbs:defaultPrefs()},d);if(!state.prefSuburbs)state.prefSuburbs=defaultPrefs();persist();alert('Imported.');}catch(e){alert('Could not read that file.');}};r.readAsText(f);}
function restoreSeed(){const key=l=>((l.url||'')+'|'+(l.title||''));const have=new Set(state.listings.map(key));seedListings().forEach(s=>{if(!have.has(key(s)))state.listings.push(s);});persist();alert('Sample listings restored (existing ones kept).');}
function wipe(){if(confirm('Delete ALL data? This cannot be undone.')){state={listings:[],owned:[],tenants:[],settings:defaultSettings()};persist();}}
function copySched(){const t=document.getElementById('schedprompt');t.select();try{document.execCommand('copy');alert('Prompt copied.');}catch(e){}}
async function persist(){await saveDB();if(sync&&sync.connected)syncPush();render();}

/* ---------- share & install ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallBtn(true);});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;showInstallBtn(false);});
function showInstallBtn(v){const b=document.getElementById('installBtn');if(b)b.style.display=v?'inline-flex':'none';}
function shareOpen(){renderShare();document.getElementById('shareModal').classList.add('show');}
function shareClose(){document.getElementById('shareModal').classList.remove('show');}
function appURL(){return location.href.startsWith('http')?location.href.split('#')[0]:'';}
function shareWhatsApp(){
  const url=appURL();
  const text='Kampus — our university property portfolio 🏠'+(url?('\n'+url):'  (I’ll send you the app file too)');
  if(navigator.share){navigator.share({title:'Kampus',text:'Our property portfolio app',url:url||undefined}).catch(()=>{});return;}
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;showInstallBtn(false);renderShare();});}
  else alert('To install: open your browser menu and choose “Add to Home screen” / “Install”. On iPhone: tap Share, then “Add to Home Screen”.');
}
function renderShare(){
  const url=appURL();
  document.getElementById('shareUrlNote').innerHTML = url
    ? 'Send this link to anyone — it opens on Android, iPhone and PC, and can be added to the home screen so it behaves like an installed app.'
    : 'You’re opening the app from a file. To share a tappable link, host it once (see below) — or just send the <b>.html file</b> on WhatsApp and open it in a browser.';
  document.getElementById('shareBody').innerHTML=`
    <button class="btn wa" style="width:100%;justify-content:center;margin-bottom:8px" onclick="shareWhatsApp()">${ic('wa')} Share on WhatsApp</button>
    ${deferredPrompt?`<button class="btn" style="width:100%;justify-content:center;margin-bottom:6px" onclick="installApp()">${ic('download')} Install app on this device</button>`:''}
    <div class="steps">
      <div class="step"><b>${ic('home')} Android</b><span>Open the link in Chrome → menu ⋮ → <b>Add to Home screen</b> (or <b>Install app</b>).</span></div>
      <div class="step"><b>${ic('home')} iPhone / iPad</b><span>Open the link in Safari → <b>Share</b> → <b>Add to Home Screen</b>.</span></div>
      <div class="step"><b>${ic('home')} PC (Windows/Mac)</b><span>Open in Chrome or Edge → click the <b>Install</b> icon in the address bar.</span></div>
    </div>
    <div class="notecard">${ic('users')}<div><b>Both of you seeing the same list?</b> Each device keeps its own copy. To sync, one of you taps <b>Finances → Export JSON</b> and WhatsApps the file; the other uses <b>Import JSON</b>. (A live shared version needs a hosted backend — happy to explain how.)</div></div>
    <details class="apkbox"><summary>Want a real installable APK / app-store file?</summary>
      <div class="hint" style="margin-top:6px">1) Host this one file for free — drag it onto <b>app.netlify.com/drop</b>, or use <b>GitHub Pages</b>. You’ll get a web address.<br>2) Paste that address into <b>PWABuilder.com</b> → it packages this exact app into a signed <b>Android APK/AAB</b> (plus Windows and iOS builds). No coding, no cost.</div>
    </details>`;
}

/* ---------- optional live sync (Firebase Firestore, user's own project) ---------- */
let sync={connected:false,applying:false,unsub:null,docRef:null,fs:null,space:'',lastPush:0,pushTimer:null};
function syncCfgLoad(){try{return JSON.parse(localStorage.getItem('kampus:sync')||'null');}catch(e){return null;}}
function syncCfgSave(c){try{localStorage.setItem('kampus:sync',JSON.stringify(c));}catch(e){}}
function syncSavedConfigText(){const c=syncCfgLoad();return c&&c.config?c.config:'';}
function parseFirebaseConfig(txt){
  let s=String(txt||'').trim();const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<0)throw new Error('No config object found');
  s=s.slice(a,b+1);
  try{return JSON.parse(s);}catch(e){}
  const j=s.replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}').replace(/,\s*]/g,']');
  return JSON.parse(j);
}
function syncStatus(t){const e=document.getElementById('syncStatus');if(e)e.textContent=t;const b=document.getElementById('syncBadge');if(b)b.style.display=sync.connected?'inline':'none';}
async function syncConnect(cfg,space){
  const appMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
  const fs=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js');
  const app=appMod.initializeApp(cfg,'kampus-'+Date.now());
  const db=fs.getFirestore(app);
  sync.fs=fs;sync.space=space;sync.docRef=fs.doc(db,'spaces',space);
  if(sync.unsub){try{sync.unsub();}catch(e){}}
  sync.unsub=fs.onSnapshot(sync.docRef,(snap)=>{
    if(snap.metadata.hasPendingWrites)return;
    const data=snap.data();if(!data||!data.state)return;
    if(data.updatedAt&&data.updatedAt===sync.lastPush)return; // our own write
    try{sync.applying=true;
      const d=JSON.parse(data.state);
      state=Object.assign({listings:[],owned:[],tenants:[],settings:defaultSettings(),prefSuburbs:defaultPrefs()},d);
      if(!state.prefSuburbs)state.prefSuburbs=defaultPrefs();
      saveDB();render();
    }catch(e){}finally{sync.applying=false;}
  },(err)=>{sync.connected=false;syncStatus('Error: '+(err&&err.code||err));});
  sync.connected=true;syncStatus('Connected · space “'+space+'”');
  syncPush(true); // seed the space with our current data
}
function syncPush(force){
  if(!sync.connected||sync.applying||!sync.fs||!sync.docRef)return;
  clearTimeout(sync.pushTimer);
  sync.pushTimer=setTimeout(async()=>{
    try{const ts=Date.now();sync.lastPush=ts;await sync.fs.setDoc(sync.docRef,{state:JSON.stringify(state),updatedAt:ts});}
    catch(e){syncStatus('Write failed — check Firestore rules');}
  },force?0:800);
}
function syncDisconnect(){if(sync.unsub){try{sync.unsub();}catch(e){}}sync.connected=false;sync.unsub=null;syncStatus('Not connected');}
async function syncConnectUI(){
  const txt=(document.getElementById('sync-config')||{}).value||'';
  let space=((document.getElementById('sync-space')||{}).value||'').trim().toLowerCase().replace(/[^\w-]+/g,'-').replace(/^-+|-+$/g,'');
  if(!txt.trim()||!space){alert('Paste your Firebase config and choose a shared space code.');return;}
  let cfg;try{cfg=parseFirebaseConfig(txt);}catch(e){alert('Could not read the Firebase config — paste the whole { … } object from your project settings.');return;}
  syncStatus('Connecting…');
  try{await syncConnect(cfg,space);syncCfgSave({config:txt.trim(),space});}
  catch(e){syncStatus('Failed: '+(e&&e.message||e));alert('Could not connect: '+(e&&e.message||e)+'\n(Check your internet and that Firestore is enabled.)');}
}
function syncDisconnectUI(){syncDisconnect();try{localStorage.removeItem('kampus:sync');}catch(e){}}

/* ---------- PWA: manifest + service worker ----------
   When hosted (http/https) we use the real manifest.webmanifest + service-worker.js
   packaged alongside this file. When opened as a bare file, we inject a manifest
   so "Add to Home screen" still names/icons the app. */
function installManifest(){
  if(location.protocol!=='file:')return; // hosted: static manifest.webmanifest is used instead
  try{
    const icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="96" fill="#14231d"/><rect x="120" y="120" width="272" height="272" rx="60" fill="#b58f43"/><text x="256" y="330" font-family="Georgia,serif" font-size="200" font-weight="700" fill="#20180a" text-anchor="middle">K</text></svg>');
    const manifest={name:'Kampus Property Portfolio',short_name:'Kampus',start_url:'.',display:'standalone',background_color:'#e9ede8',theme_color:'#14231d',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
    const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));document.head.appendChild(link);
    let al=document.createElement('link');al.rel='apple-touch-icon';al.href=icon;document.head.appendChild(al);
  }catch(e){}
}
function registerSW(){
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
}

/* ---------- boot ---------- */
function mergeSeeds(){const key=l=>((l.url||'')+'|'+(l.title||''));const have=new Set(state.listings.map(key));seedListings().forEach(s=>{if(!have.has(key(s)))state.listings.push(s);});}
(async function init(){
  installManifest();registerSW();
  const db=await loadDB();
  if(db){state=Object.assign({listings:[],owned:[],tenants:[],settings:defaultSettings(),prefSuburbs:defaultPrefs()},db);state.settings=Object.assign(defaultSettings(),state.settings||{});
    if(!state.prefSuburbs)state.prefSuburbs=defaultPrefs();['potch','stel','pta','sol'].forEach(c=>{if(!state.prefSuburbs[c])state.prefSuburbs[c]=[];});
    state.listings.forEach(l=>{if(l.radius===undefined)l.radius='core';if(l.safety===undefined)l.safety='';if(l.demand===undefined)l.demand='';if(l.areaNote===undefined)l.areaNote='';if(l.image===undefined)l.image='';if(l.drive===undefined)l.drive='';if(l.agentName===undefined)l.agentName='';if(l.agency===undefined)l.agency='';if(l.agentPhone===undefined)l.agentPhone='';if(l.agentEmail===undefined)l.agentEmail='';});}
  else state={listings:[],owned:[],tenants:[],settings:defaultSettings(),prefSuburbs:defaultPrefs()};
  mergeSeeds();await saveDB();render();
  const sc=syncCfgLoad();
  if(sc&&sc.config&&sc.space){try{const cfg=parseFirebaseConfig(sc.config);syncConnect(cfg,sc.space).catch(()=>{});}catch(e){}}
})();
</script>
